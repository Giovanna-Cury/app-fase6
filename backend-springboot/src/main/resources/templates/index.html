<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${apiName}">Smart HAS API</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }
        h1 { font-size: 2rem; margin-bottom: 8px; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(46, 204, 113, 0.18);
            color: #2ecc71;
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            margin: 12px 0 20px;
            text-transform: uppercase;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; }
        p { line-height: 1.6; color: #d0d7de; margin-bottom: 20px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a.btn {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            background: #2c5364;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.1s ease, background 0.2s ease;
        }
        a.btn:hover { background: #34718c; transform: translateY(-1px); }
        .meta { margin-top: 24px; font-size: 0.8rem; color: #8fa3ad; }
    </style>
</head>
<body>
    <div class="card">
        <h1 th:text="${apiName}">Smart HAS API</h1>
        <span class="status">
            <span class="dot"></span>
            <span th:text="${status}">online</span>
        </span>
        <p>
            API REST de monitoramento inteligente do projeto Smart HAS (FIAP).
            Autenticação via JWT Bearer. Consulte a documentação interativa abaixo.
        </p>
        <div class="links">
            <a class="btn" href="/swagger-ui.html">Swagger UI (documentação)</a>
            <a class="btn" href="/v3/api-docs">OpenAPI JSON</a>
            <a class="btn" href="/h2-console">Console H2 (banco em memória)</a>
        </div>
        <div class="meta">
            Versão <span th:text="${version}">1.0.0</span> ·
            Base URL: <code>http://localhost:8080/api</code>
        </div>
    </div>
</body>
</html>
