spring.application.name=smarthas-api
server.port=8080

# -----------------------------------------------------------------------------
# Perfil padrao: H2 em memoria (roda sem Oracle; regras PL/SQL espelhadas em
# Java por JpaAnalyticsGateway). Para Oracle: --spring.profiles.active=oracle
# (ver application-oracle.properties e database/README.md).
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:smarthas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console -> http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:smarthas)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
smarthas.jwt.secret=smarthas-super-secret-key-change-me-please-0123456789-abcdef
smarthas.jwt.expiration-ms=86400000

# Simulador de leituras IoT (evento de back-end que aciona PRC_REGISTRAR_LEITURA)
smarthas.simulator.enabled=false
smarthas.simulator.interval-ms=15000

# springdoc / swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
