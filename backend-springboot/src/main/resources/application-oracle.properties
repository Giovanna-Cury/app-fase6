# -----------------------------------------------------------------------------
# Perfil "oracle": persistencia no Oracle + regras de negocio em PL/SQL.
#   mvn spring-boot:run -Dspring-boot.run.profiles=oracle
# Schema criado por database/scripts/instalar_tudo.sql (Docker ou SQL Developer).
# Credenciais sobrescreviveis por variavel de ambiente (ex.: servidor da FIAP):
#   SMARTHAS_DB_URL=jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL
#   SMARTHAS_DB_USER=rm554433   SMARTHAS_DB_PASSWORD=******
# -----------------------------------------------------------------------------
spring.datasource.url=${SMARTHAS_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SMARTHAS_DB_USER:smarthas}
spring.datasource.password=${SMARTHAS_DB_PASSWORD:smarthas}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.pool-name=smarthas-oracle
spring.datasource.hikari.maximum-pool-size=10

# O schema e versionado pelos scripts SQL (fonte da verdade); o Hibernate
# apenas VALIDA que as entidades batem com as tabelas no startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.h2.console.enabled=false

# Liga o simulador IoT na demo com Oracle
smarthas.simulator.enabled=${SMARTHAS_SIMULATOR:false}
