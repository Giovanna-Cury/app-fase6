<!-- Layout raiz: navbar + área de conteúdo roteada -->
<header class="navbar" *ngIf="auth.isLoggedIn()">
  <div class="navbar-brand">
    <span class="logo-dot"></span>
    <span>{{ title }}</span>
  </div>

  <nav class="navbar-links">
    <a routerLink="/home" routerLinkActive="active">Home</a>
    <a routerLink="/reports" routerLinkActive="active">Relatórios</a>
    <a routerLink="/admin" routerLinkActive="active">Admin</a>
  </nav>

  <div class="navbar-user">
    <span class="user-name" *ngIf="auth.currentUser() as u">
      {{ u.name }} <small class="user-role">({{ u.role }})</small>
    </span>
    <button type="button" class="btn btn-ghost" (click)="logout()">Sair</button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
